[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pep621-app"
version = "0.2.0"
requires-python = ">=3.9"
dependencies = [
    "httpx[http2]>=0.27",
    "Rich ~= 13.7",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
cli = ["click>=8.1"]

[dependency-groups]
test = ["pytest>=8", {include-group = "lint"}]
lint = ["ruff==0.4.8"]
