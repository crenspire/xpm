name: Pages

on:
  push:
    branches: [develop]
    paths: ['site/**', 'scripts/install.sh', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Serve the installer at https://crenspire.github.io/xpm/install.sh
      # straight from scripts/install.sh, so there is one source of truth.
      - name: Add install.sh to the site
        run: cp scripts/install.sh site/install.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
