name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.22', 'stable']
        exclude:
          # Go 1.22 (EOL) links test binaries without LC_UUID, which current macOS dyld rejects.
          # 1.22 stays covered as the module floor on Linux and Windows.
          - os: macos-latest
            go-version: '1.22'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - run: go mod verify
      - name: go test
        shell: bash # PowerShell would split -coverprofile=coverage.out at the dot
        run: go test -race -coverprofile=coverage.out ./...
      - if: matrix.os == 'ubuntu-latest' && matrix.go-version == 'stable'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25' # must not be newer than the Go that built golangci-lint v2.5.0
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make build
      - run: ./xpm version

  perf:
    name: Perf budgets (informational)
    runs-on: ubuntu-latest
    needs: [build]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: sudo apt-get update && sudo apt-get install -y hyperfine jq
      - run: ./scripts/perf.sh
