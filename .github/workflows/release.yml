name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -race ./...

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # keyless cosign signing of checksums.txt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs the tags and history for the changelog
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: anchore/sbom-action/download-syft@v0 # syft, for the archive SBOMs
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: 'v2.18.2' # keep in sync with GORELEASER in the Makefile
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: without it the Homebrew cask is built but not pushed to
          # crenspire/homebrew-tap.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # Signing checksums.txt is best-effort: a signing failure must not fail a
      # release whose archives are already published. checksums.txt covers every
      # archive, so verifying its signature verifies them all:
      #
      #   cosign verify-blob \
      #     --certificate-identity-regexp 'https://github.com/crenspire/xpm/.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --signature checksums.txt.sig --certificate checksums.txt.pem \
      #     checksums.txt
      #   sha256sum --ignore-missing -c checksums.txt
      - uses: sigstore/cosign-installer@v3
        continue-on-error: true
        timeout-minutes: 5
      - name: Sign checksums.txt
        continue-on-error: true
        timeout-minutes: 5
        run: >-
          cosign sign-blob --yes
          --output-signature dist/checksums.txt.sig
          --output-certificate dist/checksums.txt.pem
          dist/checksums.txt
      - name: Upload signature
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/checksums.txt.sig dist/checksums.txt.pem --clobber
