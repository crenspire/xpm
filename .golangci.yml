# golangci-lint configuration
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor

output:
  format: colored-line-number
  print-linter-name: true
  print-issued-lines: true

linters:
  enable:
    # Default linters
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    
    # Additional linters
    - bodyclose
    - dogsled
    - dupl
    - exhaustive
    - exportloopref
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gofmt
    - goimports
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - stylecheck
    - unconvert
    - unparam
    - whitespace

  disable:
    - gochecknoglobals  # We use some global state for config
    - wsl               # Too strict on whitespace
    - lll               # Line length - too strict
    - gomnd             # Magic number detection - too noisy
    - testpackage       # Allow tests in same package
    - paralleltest      # Not all tests need to be parallel

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    check-shadowing: true
    enable-all: true

  gocyclo:
    min-complexity: 20

  funlen:
    lines: 150
    statements: 80

  goconst:
    min-len: 3
    min-occurrences: 3

  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style

  goimports:
    local-prefixes: github.com/crenspire/upm

  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf

  misspell:
    locale: US

  nakedret:
    max-func-lines: 30

  prealloc:
    simple: true
    range-loops: true
    for-loops: true

  gosec:
    excludes:
      - G104  # Audit errors not checked (we handle some intentionally)
      - G304  # File path from variable (needed for dynamic paths)

issues:
  exclude-rules:
    # Exclude some linters from running on tests
    - path: _test\.go
      linters:
        - dupl
        - funlen
        - goconst
        - gosec

    # Exclude known false positives
    - path: cmd/upm/main.go
      linters:
        - gochecknoinits

  max-issues-per-linter: 50
  max-same-issues: 10

severity:
  default-severity: warning
  rules:
    - linters:
        - errcheck
        - govet
      severity: error

