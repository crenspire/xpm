version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - os.Remove
        - os.RemoveAll
    gosec:
      excludes:
        - G107 # HTTP GET with variable URL: registry/runtime URLs are built from validated names
        - G110 # decompression bomb: runtime archives are SHA-256 verified before extraction (P2)
        - G204 # subprocess with variable args: running package managers is xpm's job
        - G301 # 0755 dirs: runtime install dirs must be traversable
        - G302 # 0644/0755 files: installed binaries must be executable
        - G304 # file path from variable: xpm reads the user's project files by design
        - G306 # WriteFile 0644: config/lock files are not secrets
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/crenspire/xpm

issues:
  # Ratchet is anchored at the tree-wide gofmt commit (2259147) so only code changed
  # after formatting must be clean. If this branch is squash-merged, update the SHA.
  # Removed at the end of P6.
  new-from-rev: "2259147ac551df545cfd26a21d78bb90edf97e7d"
